[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-term-project"
version = "0.1.0"
description = "Reproducible ML workflow for the finance term project"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
